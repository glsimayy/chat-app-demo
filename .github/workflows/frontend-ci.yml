name: Frontend CI

on:
  push:
    paths:
      - ".github/workflows/frontend-ci.yml"
      - "frontend/**"
  pull_request:
    paths:
      - ".github/workflows/frontend-ci.yml"
      - "frontend/**"

permissions:
  contents: read

jobs:
  verify-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
