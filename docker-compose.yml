services:
  postgres:
    image: postgres:16-alpine
    container_name: chat-app-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat_app_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat_app_demo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
