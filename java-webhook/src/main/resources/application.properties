spring.application.name=ello-java-webhook
server.port=${JAVA_WEBHOOK_PORT:8080}

ello.webhook.secret=${WEBHOOK_SECRET}
ello.chat.base-url=${CHAT_BACKEND_BASE_URL:http://localhost:3000}
ello.chat.bot-secret=${BOT_WEBHOOK_SECRET}
ello.chat.connect-timeout=${CHAT_BACKEND_CONNECT_TIMEOUT:1s}
ello.chat.read-timeout=${CHAT_BACKEND_READ_TIMEOUT:3s}
ello.chat.max-attempts=${CHAT_BACKEND_MAX_ATTEMPTS:2}
ello.chat.retry-delay=${CHAT_BACKEND_RETRY_DELAY:100ms}
